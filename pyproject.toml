[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scanner"
version = "0.3.0"
description = "AMD Zen 3/4/5 逐核 Curve Optimizer 极限扫描与全核叠加验证"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["amd", "ryzen", "curve-optimizer", "undervolt", "overclock", "pbo"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.scripts]
co-scanner = "co_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/DC1024/co-scanner"
Repository = "https://github.com/DC1024/co-scanner"
Issues = "https://github.com/DC1024/co-scanner/issues"

[tool.setuptools]
packages = ["co_scanner"]
